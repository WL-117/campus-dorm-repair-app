<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980"
     font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1120" height="980" fill="#FFFFFF"/>

  <!-- 连线 -->
  <g stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="660" y1="110" x2="660" y2="152"/>
    <line x1="660" y1="250" x2="660" y2="290"/>
    <line x1="660" y1="358" x2="660" y2="398"/>
    <line x1="660" y1="584" x2="660" y2="622"/>
    <line x1="660" y1="690" x2="660" y2="730"/>
    <line x1="660" y1="798" x2="660" y2="838"/>
    <line x1="468" y1="494" x2="378" y2="494"/>
    <line x1="214" y1="526" x2="214" y2="578"/>
  </g>

  <!-- 1 学生登录 / 注册 -->
  <rect x="430" y="48" width="460" height="62" rx="31" fill="#EAF2FE" stroke="#4A7FE0" stroke-width="2"/>
  <text x="660" y="87" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">学生登录 / 注册</text>

  <!-- 2 填写报修信息 -->
  <rect x="430" y="158" width="460" height="92" rx="10" fill="#EAF2FE" stroke="#4A7FE0" stroke-width="2"/>
  <text x="660" y="196" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">填写报修信息</text>
  <text x="660" y="226" text-anchor="middle" font-size="17" fill="#4B5563">故障分类 · 楼栋宿舍 · 问题描述 · 图片</text>

  <!-- 3 提交工单 -->
  <rect x="430" y="296" width="460" height="62" rx="10" fill="#FFF4E3" stroke="#E39A3B" stroke-width="2"/>
  <text x="660" y="335" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">提交工单　状态：待处理</text>

  <!-- 4 判定 -->
  <polygon points="660,404 852,494 660,584 468,494" fill="#FFFCF3" stroke="#E39A3B" stroke-width="2"/>
  <text x="660" y="502" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">管理员受理工单？</text>

  <!-- 5 派单维修 -->
  <rect x="430" y="628" width="460" height="62" rx="10" fill="#E9F1FF" stroke="#3F73D8" stroke-width="2"/>
  <text x="660" y="667" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">派单维修　状态：维修中</text>

  <!-- 6 维修完成 -->
  <rect x="430" y="736" width="460" height="62" rx="10" fill="#E7F6EC" stroke="#3B9C56" stroke-width="2"/>
  <text x="660" y="775" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">维修完成　状态：已完成</text>

  <!-- 7 学生查看 -->
  <rect x="430" y="844" width="460" height="62" rx="10" fill="#F1FAF4" stroke="#7BC08F" stroke-width="2"/>
  <text x="660" y="883" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F2937">学生查看进度与处理备注</text>

  <!-- 左侧分支：未受理 -->
  <rect x="56" y="464" width="316" height="62" rx="10" fill="#F5F6F8" stroke="#A3ABB8" stroke-width="2"/>
  <text x="214" y="502" text-anchor="middle" font-size="19" fill="#374151">保持待处理 · 等待受理</text>

  <!-- 左侧分支：已取消（终止） -->
  <rect x="56" y="584" width="316" height="62" rx="8" fill="#EFEFF1" stroke="#6B7280" stroke-width="3"/>
  <text x="214" y="622" text-anchor="middle" font-size="19" font-weight="bold" fill="#374151">已取消 · 流程结束</text>

  <!-- 分支与连线文字 -->
  <text x="676" y="612" font-size="17" font-weight="bold" fill="#3B9C56">是</text>
  <text x="416" y="484" font-size="17" font-weight="bold" fill="#6B7280">否</text>
  <text x="228" y="562" font-size="15" fill="#6B7280">学生取消</text>

  <!-- 图例 -->
  <text x="56" y="944" font-size="15" fill="#6B7280">
    图例：蓝色 = 学生端操作　橙色 = 待处理　深蓝 = 维修中　绿色 = 已完成　灰色 = 未受理 / 终止状态
  </text>
</svg>
